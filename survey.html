:root{
  --cream:#E7E2D6;        /* Neutral Cream: page ground */
  --cream-50:#F6F3EC;     /* option and field fill */
  --cream-300:#DAD3C3;    /* hairlines, progress track */
  --ink:#211F1D;          /* Warm Black: text, selected fill */
  --ink-700:#3A3733;      /* body copy */
  --muted:#58534C;        /* helper text (5.9:1 on cream) */
  --label:#6B5538;        /* section labels (5.4:1 on cream) */
  --line:#857D71;         /* control outlines (3.1:1 on cream) */
  --focus:#856A47;        /* Raw Umber focus ring */
  --accent:#CDB48C;       /* Champagne: text on a selected black tile (8:1 on Warm Black) */
  --serif:'STIX Two Text','STIX Two',Georgia,'Times New Roman',serif;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  /* Tile elevation: a tight contact shadow, a soft mid shadow and a wide faint one, plus a fine top highlight */
  --lift:inset 0 1px 0 rgba(255,255,255,.7),0 1px 1px rgba(33,31,29,.05),0 3px 6px -1px rgba(33,31,29,.06),0 12px 24px -8px rgba(33,31,29,.10);
  --lift-hover:inset 0 1px 0 rgba(255,255,255,.8),0 1px 2px rgba(33,31,29,.06),0 6px 12px -2px rgba(33,31,29,.08),0 18px 32px -10px rgba(33,31,29,.14);
  --lift-press:inset 0 1px 0 rgba(255,255,255,.6),0 1px 1px rgba(33,31,29,.06),0 2px 4px -1px rgba(33,31,29,.06);
  --lift-selected:0 1px 2px rgba(33,31,29,.18),0 6px 14px -4px rgba(33,31,29,.22),0 16px 30px -12px rgba(33,31,29,.24);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
::selection{background:#A38B67;color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
button{font:inherit;color:inherit}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--cream);padding-top:env(safe-area-inset-top)}
.top-row{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:64px;padding:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.back{width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.back:hover{background:var(--cream-300)}
.back.is-hidden{visibility:hidden}
.logo{justify-self:center;display:flex;padding:8px;border-radius:4px}
.logo img{display:block;height:22px;width:auto}
.progress{height:2px;background:var(--cream-300)}
.progress span{display:block;height:100%;width:0;background:var(--ink);transition:width 320ms var(--ease)}

/* Stage */
main{flex:1;display:flex;justify-content:center;padding:clamp(36px,8vh,80px) 20px 32px}
.screen{width:100%;max-width:560px;animation:enter 180ms var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.label{margin:0 0 18px;font-size:11px;font-weight:500;line-height:1.3;letter-spacing:.2em;text-transform:uppercase;color:var(--label)}
.q{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(28px,6.6vw,38px);line-height:1.14;letter-spacing:-0.025em;text-wrap:balance}
.q:focus{outline:none}
.q.is-display{font-size:clamp(34px,8.6vw,50px);line-height:1.08;letter-spacing:.02em;text-transform:uppercase}
.help{margin:12px 0 0;font-size:15px;line-height:1.5;color:var(--muted);text-wrap:pretty}
.body{margin:20px 0 0;font-size:17px;line-height:1.6;color:var(--ink-700);text-wrap:pretty}

/* Options */
.answers{margin-top:32px;display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;-webkit-appearance:none;width:100%;min-height:56px;margin:0;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;font-size:16px;line-height:1.35;color:var(--ink);background:#FAF8F3;border:0;border-radius:6px;box-shadow:var(--lift);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background-color 180ms var(--ease),color 320ms var(--ease) 60ms,box-shadow 200ms var(--ease),opacity 160ms var(--ease),transform 160ms var(--ease)}
.opt:hover{background:#FDFCF9;box-shadow:var(--lift-hover);transform:translateY(-1px)}
.opt:active{transform:translateY(2px) scale(.965);box-shadow:var(--lift-press);transition-duration:70ms}
.mark{flex:none;width:20px;height:20px;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:opacity 160ms var(--ease),transform 240ms cubic-bezier(.3,1.6,.5,1)}
.opt[aria-pressed="true"] .mark{opacity:1;transform:scale(1)}
.has-choice .opt[aria-pressed="false"]{opacity:.45;box-shadow:var(--lift-press)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--accent);box-shadow:var(--lift-selected)}
.opt[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.opt[aria-disabled="true"]:hover{background:#FAF8F3;box-shadow:var(--lift);transform:none}
.opt[aria-disabled="true"]:active{transform:none}
.box{flex:none;width:20px;height:20px;display:grid;place-items:center;border:1px solid currentColor;border-radius:2px}
.box svg{opacity:0}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.opt[aria-pressed="true"] .box svg{opacity:1}

/* Scale */
.scale{margin-top:32px}
.scale-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale-row .opt{aspect-ratio:1/1;min-height:0;padding:0;justify-content:center;font-family:var(--serif);font-size:clamp(22px,5.5vw,28px);line-height:1}
.scale-ends{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:13px;color:var(--muted)}

/* Text */
.field{margin-top:32px}
textarea,input[type="email"]{width:100%;margin:0;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:var(--cream-50);border:1px solid var(--line);border-radius:4px;-webkit-appearance:none;appearance:none}
textarea{display:block;min-height:168px;padding:14px 16px;resize:vertical}
input[type="email"]{height:56px;padding:0 16px}
textarea::placeholder,input::placeholder{color:#6F685E;opacity:1}
textarea:focus-visible,input[type="email"]:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--ink)}
.count{margin-top:8px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Actions */
.actions{margin-top:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;padding:0 28px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--cream);font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color 160ms var(--ease),color 160ms var(--ease),transform 120ms var(--ease)}
.btn:hover{background:var(--ink-700)}
.btn:active{transform:scale(.985)}
.btn:disabled{background:var(--cream-300);border-color:var(--cream-300);color:#7A7266;cursor:not-allowed;transform:none}
.btn.is-outline{background:transparent;color:var(--ink)}
.btn.is-outline:hover{background:var(--ink);color:var(--cream)}
.skip{display:block;margin:14px auto 0;padding:10px 14px;border:0;background:none;font-size:15px;color:var(--muted);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
.skip:hover{color:var(--ink)}
@media (max-width:640px){
  .actions.is-sticky{position:sticky;bottom:0;z-index:2;margin-left:-20px;margin-right:-20px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--cream) 72%,rgba(231,226,214,0))}
}

/* Age wheel */
.wheel{position:relative;margin-top:28px;height:168px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:4px;-webkit-tap-highlight-color:transparent}
.wheel.is-dragging{cursor:grabbing}
.wheel-unit{display:block;margin-top:14px;text-align:center;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--label)}
.wheel-track{position:absolute;left:0;right:0;bottom:0;height:68px;overflow:hidden;perspective:900px;perspective-origin:50% -40px}
/* One large age, fixed in place; it changes a year at a time as the ruler turns */
.wheel-value{will-change:transform,filter,opacity;position:absolute;left:0;right:0;top:0;height:100px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:400;font-size:clamp(76px,21vw,96px);line-height:1;letter-spacing:0;color:var(--ink);pointer-events:none}
.wheel-value i{display:inline-block;width:.56em;font-style:normal;text-align:center;will-change:transform,filter,opacity} /* fixed digit slots: tabular whatever the font supports */
/* Ruler on the drum: ticks share the cylinder with the numbers; long tick under every age, darker every 5, quarter ticks between */
.wheel-tick{position:absolute;left:50%;bottom:8px;width:1.5px;height:10px;margin-left:-.75px;background:var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform,opacity}
.wheel-tick.is-year{height:22px;background:var(--ink-700)}
.wheel-tick.is-five{width:2px;height:30px;margin-left:-1px;background:var(--ink)}
.wheel-needle{position:absolute;left:50%;bottom:4px;width:2px;height:44px;margin-left:-1px;background:var(--label);border-radius:1px;pointer-events:none;z-index:2}
.wheel-alt{display:block;margin:14px auto 0;padding:10px 14px;border:0;background:none;font-size:15px;color:var(--muted);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
.wheel-alt:hover,.wheel-alt[aria-pressed="true"]{color:var(--ink)}
.wheel-alt[aria-pressed="true"]{font-weight:500}

/* Concept */
.steps{margin:28px 0 0;padding:0;list-style:none;border-top:1px solid var(--cream-300)}
.steps li{display:grid;grid-template-columns:minmax(0,11.5rem) minmax(0,1fr);gap:8px 28px;align-items:start;padding:22px 0;border-bottom:1px solid var(--cream-300)}
.steps b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;line-height:1;letter-spacing:.06em;text-transform:uppercase;margin-top:var(--cap-nudge,0px)}
.q.is-caps{text-transform:uppercase;letter-spacing:.02em}
.steps span{font-size:15px;line-height:1.55;color:var(--ink-700)}
@media (max-width:480px){.steps li{grid-template-columns:1fr}}
@media (min-width:481px){.steps b{--cap-nudge:4px}} /* side by side: drop the serif caps so their tops meet the first line of the description (measured, not baseline) */

/* Email */
.email-label{display:block;margin:32px 0 10px;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--label)}
.consent{display:flex;align-items:flex-start;gap:12px;margin-top:16px;padding:4px 0;font-size:15px;line-height:1.5;color:var(--ink-700);cursor:pointer}
.consent input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:1px 0 0;display:grid;place-content:center;border:1px solid var(--line);border-radius:2px;background:var(--cream-50);cursor:pointer}
.consent input:checked{background:var(--ink);border-color:var(--ink)}
.consent input:checked::after{content:"";width:10px;height:5px;border-left:1.5px solid var(--cream);border-bottom:1.5px solid var(--cream);transform:translateY(-1px) rotate(-45deg)}
.hint{margin:8px 0 0 32px;font-size:13px;line-height:1.45;color:var(--label)}
.hint[hidden]{display:none}
.fine{margin:20px 0 0;font-size:13px;line-height:1.5;color:var(--muted);text-align:center}

/* Socials prompt */
.social-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:32px}
a.opt.social-tile,.opt.social-tile{flex-direction:column;justify-content:center;gap:10px;aspect-ratio:1/1;min-height:0;padding:12px 8px;text-align:center;text-decoration:none}
.social-tile svg{width:clamp(40px,12vw,52px);height:clamp(40px,12vw,52px)}
.social-tile .st-name{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;line-height:1.2}
.social-tile[aria-disabled="true"] .st-name{letter-spacing:.08em}

/* Thanks */
.social{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:32px;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.social a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.social a:hover{color:var(--label)}

/* Footer */
.foot{display:flex;justify-content:center;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.foot a{padding:8px;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* "Other" write-in */
.other{margin-top:10px}
.other[hidden]{display:none}
.other input{width:100%;height:56px;margin:0;padding:0 16px;font:inherit;font-size:16px;color:var(--ink);background:var(--cream-50);border:1px solid var(--line);border-radius:4px;-webkit-appearance:none;appearance:none}
.other input::placeholder{color:#6F685E;opacity:1}
.other input:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--ink)}
.invest-more[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .screen{animation:none}
  .opt,.btn,.progress span{transition:none}
}
</style>
</head>

    el.appendChild(h('p', { 'class': 'body', text: 'Your answers help shape what we build. We can’t wait to meet you.' }));
    if (joined) el.appendChild(h('p', { 'class': 'body', text: 'You’re on the list.' }));
    if (investor) el.appendChild(h('p', { 'class': 'body', text: 'We’ll be in touch about investing.' }));
    el.appendChild(h('div', { 'class': 'social' }, [
      h('a', { href: INSTAGRAM, target: '_blank', rel: 'noopener', text: 'Instagram' }),
      h('a', { href: TIKTOK, target: '_blank', rel: 'noopener', text: 'TikTok' })
    ]));
    el.appendChild(h('div', { 'class': 'actions' }, [h('a', { 'class': 'btn is-outline', href: HOME, text: 'Back to home' })]));
    return 'Thank you.' + (joined ? ' You’re on the list.' : '');
  }

  // ─── Keyboard: number keys pick, Enter continues ─────────────────────────
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented) return; // already handled by the field itself
    var t = e.target, tag = t && t.tagName;
    var typing = tag === 'TEXTAREA' || (tag === 'INPUT' && t.type !== 'checkbox');
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && tag === 'TEXTAREA') {
      var b0 = $screen.querySelector('[data-primary]');
      if (b0 && !b0.disabled) { e.preventDefault(); b0.click(); }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (currentWheel && /^[0-9]$/.test(e.key) && !typing) { e.preventDefault(); currentWheel.digit(e.key); return; }
    if (/^[1-9]$/.test(e.key) && !typing) {
      var opt = $screen.querySelectorAll('[data-opt]')[Number(e.key) - 1];
      if (opt) { e.preventDefault(); opt.click(); }
      return;
    }
    // On a multi-choice screen Enter continues even from a focused option (Space toggles it).
    var onOption = tag === 'BUTTON' && t.hasAttribute('data-opt');
    if (e.key === 'Enter' && !e.shiftKey && tag !== 'TEXTAREA' && tag !== 'A' && (tag !== 'BUTTON' || onOption)) {
      var b = $screen.querySelector('[data-primary]');
      if (onOption && !b) return;
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  });

  // iOS Safari only shows the :active press on tiles when a touch listener exists.
  document.addEventListener('touchstart', function () {}, { passive: true });

  // ─── Start ───────────────────────────────────────────────────────────────
  render();
  if (S.step !== 'intro') armGuard();
})();
</script>
